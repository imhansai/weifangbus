name: weifangbus
description: 潍坊公交
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: ^3.5.3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  url_launcher: ^6.3.2
  device_info_plus: ^11.5.0
  connectivity_plus: ^6.1.4
  dio: ^5.7.0
  crypto: ^3.0.5
  intl: ^0.20.2
  cached_network_image: ^3.4.1
  carousel_slider: ^5.1.1
  easy_refresh: ^3.4.0
  easy_refresh_bubbles: ^1.0.0
  provider: ^6.1.5
  auto_size_text: ^3.0.0
  flutter_widget_from_html_core: ^0.17.0
  photo_view: ^0.15.0
  shared_preferences: ^2.5.3
  package_info_plus: ^8.0.3
  json_annotation: ^4.9.0

dev_dependencies:
  build_runner: ^2.6.0
  flutter_test:
    sdk: flutter
  json_serializable: ^6.10.0
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/guide/
    - assets/images/home/
  fonts:
    - family: myIcon
      fonts:
        - asset: fonts/iconfont.ttf
  # 国际化
  generate: true
